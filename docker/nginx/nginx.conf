# Nginx DEV de AtoM. Adaptado de upstream (docker/etc/nginx/nginx.conf, AtoM v2.10.2): mismas reglas
# de enrutado y denegaciones; cambia solo la resolución de `atom` (ver `resolver`).
#
# Este Nginx sirve estáticos de solo lectura (dist/images/css/js, uploads/ y downloads/ montados RO)
# y reenvía toda la ejecución de PHP a PHP-FPM (`atom:9000`) por FastCGI.
user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  sendfile on;
  keepalive_timeout 65;
  gzip on;

  # Diferencia respecto a upstream: `upstream atom { server atom:9000; }` resuelve el nombre una sola vez al
  # arrancar; al recrear `atom` (IP nueva) Nginx daría 502 hasta reiniciarse. Con resolver + variable, el nombre
  # se resuelve por el DNS embebido de Docker durante la ejecución.
  resolver 127.0.0.11 valid=5s ipv6=off;
  # Con `atom` ausente (o su IP cacheada ya vacía), falla rápido (502/504) en lugar de colgar la petición.
  resolver_timeout 2s;
  fastcgi_connect_timeout 3s;

  server {
    listen 80;
    root /atom/src;
    server_name _;
    set $atom_fpm atom:9000;
    # Alineado con post_max_size (72M) de PHP.
    client_max_body_size 72M;

    location / {
      try_files $uri /index.php?$args;
    }
    location ~ /\. {
      deny all;
      return 404;
    }
    location ~* (\.yml|\.ini|\.tmpl)$ {
      deny all;
      return 404;
    }
    location ~* /(?:uploads|files)/.*\.php$ {
      deny all;
      return 404;
    }
    location ~* /uploads/r/(.*)/conf/ { }
    # Objetos digitales con control de acceso: los resuelve AtoM.
    location ~* ^/uploads/r/(.*)$ {
      include /etc/nginx/fastcgi_params;
      set $index /index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$index;
      fastcgi_param SCRIPT_NAME $index;
      fastcgi_pass $atom_fpm;
    }
    # Destino de X-Accel-Redirect (digitalobject/view): AtoM autoriza y Nginx entrega el fichero desde uploads/ (RO).
    location ~ ^/private/(.*)$ {
      internal;
      alias /atom/src/$1;
    }
    location ~ ^/(index|qubit_dev)\.php(/|$) {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_split_path_info ^(.+\.php)(/.*)$;
      fastcgi_pass $atom_fpm;
    }
    location ~* \.php$ {
      deny all;
      return 404;
    }
  }
}
