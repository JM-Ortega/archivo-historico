name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  minimal-checks:
    name: Minimal checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax check (bash -n)
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "::group::bash -n $f"
            bash -n "$f" || status=1
            echo "::endgroup::"
          done < <(git ls-files -z -- '*.sh')
          exit "$status"

      - name: Compose validation
        run: docker compose config

  main-source-policy:
    name: Main source policy
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verify PR into main originates from develop in this repository
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "$HEAD_REF" ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REF" = "develop" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "PR source is develop from ${BASE_REPO}: OK"
            exit 0
          fi
          echo "::error::PRs into main must originate from branch 'develop' in ${BASE_REPO} (got branch '${HEAD_REF}' from repo '${HEAD_REPO}')"
          exit 1
