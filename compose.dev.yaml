# Compose DEV: servicios de soporte (percona, elasticsearch, memcached, gearmand).
#
#   docker compose -f compose.dev.yaml up -d --wait
#
# Los valores por defecto son credenciales locales de desarrollo;
# pueden sobrescribirse mediante variables de entorno.

# Nombre fijo para que los recursos (red, volúmenes) no dependan del nombre del directorio.
name: archivo-historico

# Conexión de AtoM a sus dependencias. La comparten `bootstrap` y `atom`: el bootstrap prepara
# exactamente la BD/índice/caché contra los que después opera el runtime.
x-atom-connection-env: &atom-connection-env
  ATOM_MYSQL_DSN: ${ATOM_MYSQL_DSN:-mysql:host=percona;port=3306;dbname=${MYSQL_DATABASE:-atom};charset=utf8mb4}
  ATOM_MYSQL_USERNAME: ${MYSQL_USER:-atom}
  ATOM_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-atom_12345}
  ATOM_ELASTICSEARCH_HOST: ${ATOM_ELASTICSEARCH_HOST:-elasticsearch:9200}
  # QubitCache y sesiones usan Memcached; Gearman solo lo exige el bootstrap upstream (aún sin worker).
  ATOM_MEMCACHED_HOST: ${ATOM_MEMCACHED_HOST:-memcached:11211}
  ATOM_GEARMAND_HOST: gearmand:4730

services:
  percona:
    image: percona/percona-server:8.4.11-11.1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-my-secret-pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-atom}
      MYSQL_USER: ${MYSQL_USER:-atom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-atom_12345}
    volumes:
      # Estado autoritativo.
      - percona_data:/var/lib/mysql
      # sql_mode y collation que AtoM requiere.
      - ./docker/percona/mysqld.cnf:/etc/my.cnf.d/mysqld.cnf:ro
    # La imagen declara VOLUME /var/log/mysql; sin tmpfs cada `down` deja un volumen anónimo huérfano.
    tmpfs:
      - /var/log/mysql
    healthcheck:
      # Se usa TCP (127.0.0.1): el servidor temporal de inicialización corre con skip-networking
      # y respondería por socket antes de que la DB esté realmente lista.
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    environment:
      # Nodo único de desarrollo. memory_lock requiere ulimits.memlock sin límite.
      bootstrap.memory_lock: "true"
      bootstrap.system_call_filter: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms640m -Xmx640m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      # Estado derivado: los índices se reconstruyen desde la DB y no forman parte
      # del conjunto mínimo de recuperación.
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  memcached:
    image: memcached:1.6.45
    command: ["-p", "11211", "-m", "128", "-u", "memcache"]
    # Caché efímera: sin volumen a propósito.
    healthcheck:
      # /dev/tcp de bash: evita depender de herramientas adicionales en la imagen.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/11211 && printf 'version\\r\\n' >&3 && read -t 2 -r line <&3 && [[ $$line == VERSION* ]]",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  gearmand:
    image: artefactual/gearmand:2.1.0
    # Cola de trabajos en memoria: sin volumen a propósito.
    healthcheck:
      # /dev/tcp de bash: evita depender de herramientas adicionales en la imagen.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/4730 && printf 'version\\n' >&3 && read -t 2 -r line <&3 && [[ $$line == OK* ]]",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Herramienta puntual (no arranca con `up`): detector de estado de la BD.
  #
  #   docker compose -f compose.dev.yaml run --rm db-probe; echo $?
  #
  # Reutiliza la imagen directa de AtoM (solo por su PHP/PDO) y monta RO únicamente el script.
  db-probe:
    profiles: [tools]
    image: archivo-historico/atom:2.10.2
    build:
      context: upstream/atom
    entrypoint: ["php", "/probe/db-probe.php"]
    environment:
      ATOM_MYSQL_DSN: ${ATOM_MYSQL_DSN:-mysql:host=percona;port=3306;dbname=${MYSQL_DATABASE:-atom};charset=utf8mb4}
      ATOM_MYSQL_USERNAME: ${MYSQL_USER:-atom}
      ATOM_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-atom_12345}
    volumes:
      - ./scripts/db-probe.php:/probe/db-probe.php:ro
    depends_on:
      percona:
        condition: service_healthy

  # Herramienta puntual (no arranca con `up`): bootstrap de AtoM (probe → tools:install si la BD está FRESH → installation-check).
  #
  #   docker compose -f compose.dev.yaml run --rm bootstrap; echo $?
  #
  # Conserva el entrypoint upstream (genera la configuración runtime desde el entorno) y monta RO
  # solo los scripts del proyecto. No levanta web ni worker.
  bootstrap:
    # `runtime` solo para que `atom` pueda depender de él (Compose exige que la dependencia esté en el perfil activo).
    profiles: [tools, runtime]
    image: archivo-historico/atom:2.10.2
    build:
      context: upstream/atom
    command: ["bash", "/project/scripts/bootstrap.sh"]
    environment:
      <<: *atom-connection-env
      ATOM_SEARCH_INDEX: ${ATOM_SEARCH_INDEX:-atom}
      # Credenciales de admin locales de DEV (no sensibles).
      ATOM_ADMIN_EMAIL: ${ATOM_ADMIN_EMAIL:-admin@example.com}
      ATOM_ADMIN_USERNAME: ${ATOM_ADMIN_USERNAME:-admin}
      ATOM_ADMIN_PASSWORD: ${ATOM_ADMIN_PASSWORD:-admin_dev_12345}
      ATOM_SITE_TITLE: ${ATOM_SITE_TITLE:-Archivo Histórico (DEV)}
      # El límite por defecto de upstream (512M) se agota en tools:install (carga de fixtures/i18n).
      ATOM_PHP_MEMORY_LIMIT: ${ATOM_PHP_MEMORY_LIMIT:-2G}
      BOOTSTRAP_WAIT_ATTEMPTS: ${BOOTSTRAP_WAIT_ATTEMPTS:-30}
      BOOTSTRAP_WAIT_INTERVAL: ${BOOTSTRAP_WAIT_INTERVAL:-2}
    volumes:
      - ./scripts/bootstrap.sh:/project/scripts/bootstrap.sh:ro
      - ./scripts/db-probe.php:/project/scripts/db-probe.php:ro
      - ./scripts/installation-check.php:/project/scripts/installation-check.php:ro
    depends_on:
      percona:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      memcached:
        condition: service_healthy

  # Runtime AtoM (PHP-FPM, escucha en 9000 solo dentro de la red Compose; Nginx llegará en otra WU).
  # No arranca con `up` de la infraestructura: requiere el perfil `runtime`.
  #
  #   docker compose -f compose.dev.yaml --profile runtime up -d --wait atom
  #
  # Gate: depende de `bootstrap` con service_completed_successfully, así que `atom` solo puede arrancar
  # después de un bootstrap exitoso (BD DB_COMPATIBLE + instalación completa; sobre una BD FRESH la instala,
  # en cualquier otro estado hace STOP). El bootstrap es idempotente: una BD DB_COMPATIBLE + INSTALL_COMPLETE
  # nunca se reinstala.
  #
  # Conserva el CMD y el entrypoint upstream (regeneran la configuración runtime desde el entorno en cada
  # arranque); el código viene de la imagen, sin bind del checkout. Solo uploads/ y downloads/ se persisten.
  atom:
    profiles: [runtime]
    image: archivo-historico/atom:2.10.2
    build:
      context: upstream/atom
    environment:
      <<: *atom-connection-env
    volumes:
      # Estado autoritativo: objetos digitales (no reconstruibles).
      - uploads_data:/atom/src/uploads
      # Política conservadora: mezcla de reconstruible (informes, EAD/XML) y no reconstruible; se persiste.
      - downloads_data:/atom/src/downloads
    healthcheck:
      # Vivacidad de PHP-FPM: el socket de la pool acepta conexiones (sin ejecutar AtoM; HTTP llegará con Nginx).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      percona:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      memcached:
        condition: service_healthy
      gearmand:
        condition: service_healthy

volumes:
  percona_data:
  elasticsearch_data:
  # Compartidos más adelante por atom_worker (RW) y Nginx (RO).
  uploads_data:
  downloads_data:
