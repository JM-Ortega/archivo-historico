# Entorno local de desarrollo.
# Este Compose NO define el despliegue de producción.
#
# `docker compose up -d --wait` levanta el runtime DEV completo: percona, elasticsearch, memcached, gearmand,
# bootstrap, theme_build (compila el theme), atom (PHP-FPM), atom_worker (jobs:worker) y nginx
# (http://localhost:8080). Los servicios que forman parte del trabajo cotidiano NO llevan `profiles`;
# el profile `tools` queda para helpers opt-in (db-probe).
# Para diagnóstico se pueden seleccionar servicios explícitos (`docker compose up -d percona`).
#
# Los valores por defecto son credenciales locales de desarrollo;
# pueden sobrescribirse mediante variables de entorno.

# Nombre fijo de la instancia DEV canónica: recursos (contenedores, red, volúmenes) estables e independientes
# del nombre del directorio. Una segunda instancia paralela usa `-p <otro-nombre>`.
name: archivo-historico

# Conexión de AtoM a sus dependencias. La comparten `bootstrap` y `atom`: el bootstrap prepara
# exactamente la BD/índice/caché contra los que después opera el runtime.
x-atom-connection-env: &atom-connection-env
  ATOM_MYSQL_DSN: ${ATOM_MYSQL_DSN:-mysql:host=percona;port=3306;dbname=${MYSQL_DATABASE:-atom};charset=utf8mb4}
  ATOM_MYSQL_USERNAME: ${MYSQL_USER:-atom}
  ATOM_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-atom_12345}
  ATOM_ELASTICSEARCH_HOST: ${ATOM_ELASTICSEARCH_HOST:-elasticsearch:9200}
  # QubitCache y sesiones usan Memcached. Gearman: el entrypoint upstream lo exige siempre y de él sale
  # apps/qubit/config/gearman.yml (servidor que usan `atom_worker` y el encolado de jobs desde `atom`).
  ATOM_MEMCACHED_HOST: ${ATOM_MEMCACHED_HOST:-memcached:11211}
  ATOM_GEARMAND_HOST: gearmand:4730

# Configuración runtime crítica de AtoM (bootstrap, reconcile, atom y atom_worker). El entrypoint del proyecto
# (config/atom/runtime-config.sh) la vuelca en el settings.yml efímero del contenedor ANTES de que corra cualquier comando
# (incluido `tools:install`) y delega en el entrypoint upstream.
#   - ATOM_PHP_DATE_TIMEZONE es UNA sola intención ambiental (`ATOM_TIMEZONE`, DEV: America/Bogota): el entrypoint upstream la
#     vuelca en php.ini (`date.timezone`) y el del proyecto en `default_timezone` de Symfony (que, si divergiera, ganaría dentro de la app).
#   - El secreto CSRF llega como FICHERO (ATOM_CSRF_SECRET_FILE), nunca como valor de entorno: no aparece en `docker inspect`.
#     En DEV lo genera una vez `dev_secrets` en el volumen `atom_secrets`; un despliegue real aporta su propio fichero.
#   - default_culture (es) es PROJECT-MANAGED: constante en runtime-config.sh, no configurable por entorno.
x-atom-runtime-env: &atom-runtime-env
  ATOM_PHP_DATE_TIMEZONE: ${ATOM_TIMEZONE:-America/Bogota}
  ATOM_CSRF_SECRET_FILE: /run/atom-secrets/csrf_secret

# Binds/volúmenes de solo lectura del entrypoint del proyecto y del secreto (se reutilizan como elementos de `volumes`).
x-atom-runtime-script: &atom-runtime-script ./config/atom/runtime-config.sh:/project/scripts/runtime-config.sh:ro
x-atom-secrets-volume: &atom-secrets-volume atom_secrets:/run/atom-secrets:ro

# Imagen AtoM del proyecto (build upstream sin modificar). La comparten db-probe, bootstrap, atom, atom_worker y
# theme_build: una sola imagen y un solo build. Cada servicio la referencia con `<<: *atom-image`.
x-atom-image: &atom-image
  image: archivo-historico/atom:2.10.2
  build:
    context: upstream/atom

services:
  percona:
    image: percona/percona-server:8.4.11-11.1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-my-secret-pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-atom}
      MYSQL_USER: ${MYSQL_USER:-atom}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-atom_12345}
    volumes:
      # Estado autoritativo.
      - percona_data:/var/lib/mysql
      # sql_mode y collation que AtoM requiere.
      - ./docker/percona/mysqld.cnf:/etc/my.cnf.d/mysqld.cnf:ro
    # La imagen declara VOLUME /var/log/mysql; sin tmpfs cada `down` deja un volumen anónimo huérfano.
    tmpfs:
      - /var/log/mysql
    healthcheck:
      # Se usa TCP (127.0.0.1): el servidor temporal de inicialización corre con skip-networking
      # y respondería por socket antes de que la DB esté realmente lista.
      test:
        [
          "CMD-SHELL",
          'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    environment:
      # Nodo único de desarrollo. memory_lock requiere ulimits.memlock sin límite.
      bootstrap.memory_lock: "true"
      bootstrap.system_call_filter: "false"
      cluster.routing.allocation.disk.threshold_enabled: "false"
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms640m -Xmx640m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      # Estado derivado: los índices se reconstruyen desde la DB y no forman parte
      # del conjunto mínimo de recuperación.
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  memcached:
    image: memcached:1.6.45
    command: ["-p", "11211", "-m", "128", "-u", "memcache"]
    # Caché efímera: sin volumen a propósito.
    healthcheck:
      # /dev/tcp de bash: evita depender de herramientas adicionales en la imagen.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/11211 && printf 'version\\r\\n' >&3 && read -t 2 -r line <&3 && [[ $$line == VERSION* ]]",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  gearmand:
    image: artefactual/gearmand:2.1.0
    # Cola de trabajos en memoria: sin volumen a propósito.
    healthcheck:
      # /dev/tcp de bash: evita depender de herramientas adicionales en la imagen.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/4730 && printf 'version\\n' >&3 && read -t 2 -r line <&3 && [[ $$line == OK* ]]",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Herramienta puntual opt-in (profile `tools`; no arranca con `up`): detector de estado de la BD.
  #
  #   docker compose run --rm db-probe; echo $?
  #
  # Reutiliza la imagen directa de AtoM (solo por su PHP/PDO) y monta RO únicamente el script.
  db-probe:
    profiles: [tools]
    <<: *atom-image
    entrypoint: ["php", "/probe/db-probe.php"]
    environment:
      ATOM_MYSQL_DSN: ${ATOM_MYSQL_DSN:-mysql:host=percona;port=3306;dbname=${MYSQL_DATABASE:-atom};charset=utf8mb4}
      ATOM_MYSQL_USERNAME: ${MYSQL_USER:-atom}
      ATOM_MYSQL_PASSWORD: ${MYSQL_PASSWORD:-atom_12345}
    volumes:
      - ./scripts/db-probe.php:/probe/db-probe.php:ro
    depends_on:
      percona:
        condition: service_healthy

  # Secretos locales de DEV (one-shot; queda en Exited (0)). SOLO DEV: garantiza el secreto CSRF en el volumen `atom_secrets`.
  # Lo genera UNA vez (256 bits de /dev/urandom) y no lo toca mientras exista: estable en stop/down/recreate/`up`; solo un RESET DEV
  # (`docker compose down -v`) lo elimina y el siguiente `up` genera uno nuevo. No lo imprime ni lo pasa por entorno.
  # Es el ÚNICO servicio con el volumen en escritura; los consumidores lo montan RO. Sin puertos ni acceso a la BD.
  #
  #   docker compose run --rm dev_secrets; echo $?
  dev_secrets:
    <<: *atom-image
    entrypoint: ["bash", "/project/scripts/dev-secrets.sh"]
    volumes:
      - ./config/atom/dev-secrets.sh:/project/scripts/dev-secrets.sh:ro
      - atom_secrets:/run/atom-secrets

  # Bootstrap de AtoM (probe → tools:install si la BD está FRESH → installation-check). Forma parte del ciclo
  # normal: `up` lo ejecuta antes de `atom` y `atom_worker` (gate) y queda en estado Exited (0).
  # Ejecución manual (diagnóstico): `docker compose run --rm bootstrap; echo $?`
  #
  # Entrypoint del proyecto (config/atom/runtime-config.sh: aplica cultura, timezone y secreto CSRF al settings.yml ANTES de
  # `tools:install`; delega en el upstream, que genera el resto de la configuración runtime desde el entorno) y monta RO solo
  # los scripts del proyecto y el secreto. Depende de `dev_secrets`. No levanta web ni worker.
  bootstrap:
    <<: *atom-image
    entrypoint: ["bash", "/project/scripts/runtime-config.sh"]
    command: ["bash", "/project/scripts/bootstrap.sh"]
    environment:
      <<: [*atom-connection-env, *atom-runtime-env]
      ATOM_SEARCH_INDEX: ${ATOM_SEARCH_INDEX:-atom}
      # Credenciales de admin locales de DEV (no sensibles).
      ATOM_ADMIN_EMAIL: ${ATOM_ADMIN_EMAIL:-admin@example.com}
      ATOM_ADMIN_USERNAME: ${ATOM_ADMIN_USERNAME:-admin}
      ATOM_ADMIN_PASSWORD: ${ATOM_ADMIN_PASSWORD:-admin_dev_12345}
      ATOM_SITE_TITLE: ${ATOM_SITE_TITLE:-Archivo Histórico (DEV)}
      # El límite por defecto de upstream (512M) se agota en tools:install (carga de fixtures/i18n).
      ATOM_PHP_MEMORY_LIMIT: ${ATOM_PHP_MEMORY_LIMIT:-2G}
      BOOTSTRAP_WAIT_ATTEMPTS: ${BOOTSTRAP_WAIT_ATTEMPTS:-30}
      BOOTSTRAP_WAIT_INTERVAL: ${BOOTSTRAP_WAIT_INTERVAL:-2}
    volumes:
      - *atom-runtime-script
      - *atom-secrets-volume
      - ./scripts/bootstrap.sh:/project/scripts/bootstrap.sh:ro
      - ./scripts/db-probe.php:/project/scripts/db-probe.php:ro
      - ./scripts/installation-check.php:/project/scripts/installation-check.php:ro
    depends_on:
      dev_secrets:
        condition: service_completed_successfully
      percona:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      memcached:
        condition: service_healthy

  # Reconcile de AtoM (one-shot; queda en Exited (0), como `bootstrap` y `theme_build`). Alinea SOLO estado PROJECT-MANAGED, en
  # dos pasos selectivos (config/atom/reconcile.sh):
  #   1. plugins: cada plugin de config/atom/required-plugins.conf (hoy arUnicaucaB5Plugin) habilitado en la BD. Aditivo: solo añade
  #      el plugin requerido si falta, no gestiona ni quita plugins ajenos, y verifica la postcondición releyendo el estado.
  #   2. check_for_updates = 0 (la única fila de `setting` que gestiona el proyecto): escribe solo si difiere, invalida SOLO la caché
  #      de settings (`settings:i18n:*`, nunca flush_all: destruiría las sesiones) y exige la postcondición (BD y caché).
  # Idempotente y no destructivo. No instala, no siembra ni compila assets.
  #
  #   docker compose run --rm reconcile; echo $?
  #
  # Gate: depende de `bootstrap` (BD instalada y compatible) y `atom` / `atom_worker` dependen de su éxito: un reconcile fallido
  # los deja sin arrancar. Independiente de `theme_build`. Supone un único writer durante este gate pre-start; no asume
  # hot-reconcile: un `up` que cambie el estado recrea `atom`/`atom_worker` (su dependencia cambió), pero `run` manual sobre un
  # AtoM en marcha no garantiza que lo vea sin reiniciarlo.
  #
  # Entrypoint del proyecto (runtime-config.sh: cultura, timezone y secreto CSRF; delega en el upstream) y monta RO solo lo
  # necesario: el plugin (para validar su source y para que la CLI de AtoM lo cargue), los scripts y el desired state.
  # Escribe únicamente en la BD (vía tools:atom-plugins y QubitSetting) y en la caché de settings de Memcached.
  reconcile:
    <<: *atom-image
    entrypoint: ["bash", "/project/scripts/runtime-config.sh"]
    command: ["bash", "/project/scripts/reconcile.sh"]
    environment:
      <<: [*atom-connection-env, *atom-runtime-env]
    volumes:
      - *atom-runtime-script
      - *atom-secrets-volume
      - ./plugins/arUnicaucaB5Plugin:/atom/src/plugins/arUnicaucaB5Plugin:ro
      - ./config/atom/reconcile.sh:/project/scripts/reconcile.sh:ro
      - ./config/atom/reconcile-plugins.sh:/project/scripts/reconcile-plugins.sh:ro
      - ./config/atom/reconcile-check-for-updates.php:/project/scripts/reconcile-check-for-updates.php:ro
      - ./config/atom/required-plugins.conf:/project/config/atom/required-plugins.conf:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # Build del theme institucional arUnicaucaB5Plugin (one-shot; queda en Exited (0), como `bootstrap`).
  #
  #   docker compose run --rm theme_build; echo $?     # tras editar SCSS/JS del theme
  #
  # Misma imagen AtoM que `atom` (Webpack/Node ya están en ella: nada en el host). Ejecuta el wrapper del propio
  # theme (tools/build.sh): `npm run build` upstream, corrección de ownership de templates/_layout_start.php y
  # comprobación de coherencia partial <-> dist. El entrypoint upstream se omite a propósito: no hace falta
  # configuración runtime ni BD; el build del theme es independiente del bootstrap de la BD.
  #
  # Escribe SOLO dos cosas derivadas: el partial generado (bind RW del plugin) y `theme_dist` (named volume).
  # `atom`, `atom_worker` y `nginx` dependen de su éxito: el runtime no consume el theme sin un build correcto.
  theme_build:
    <<: *atom-image
    entrypoint: ["bash", "/atom/src/plugins/arUnicaucaB5Plugin/tools/build.sh"]
    volumes:
      - ./plugins/arUnicaucaB5Plugin:/atom/src/plugins/arUnicaucaB5Plugin
      # Derivado y reconstruible (webpack `clean: true`): NO es estado, NO va a backup.
      - theme_dist:/atom/src/dist

  # Watch DEV opt-in del theme institucional arUnicaucaB5Plugin (profile `tools`; no arranca con `up`).
  #
  #   docker compose run --rm theme_watch
  #
  # Interactivo/persistente, exclusivamente DEV/DX: complementa a `theme_build` (one-shot, determinista, el que usan
  # startup/CI/recuperación), no lo sustituye. Misma imagen y mismo boundary de escritura que `theme_build` (plugin
  # RW + theme_dist RW): el wrapper del propio theme (tools/watch.sh) ejecuta `webpack watch` (el comando subyacente
  # a "npm run watch" en package.json, invocado directamente y sin pasar por npm: sin polling de filesystem) y
  # mantiene corregido el ownership de templates/_layout_start.php mientras dura la sesión, incluida su recreación
  # en cada rebuild. Sin puertos, sin dependencia del runtime AtoM ni de la BD. Foreground: Ctrl+C detiene watch y
  # companion sin procesos huérfanos y sin afectar a `atom`/`nginx`.
  theme_watch:
    profiles: [tools]
    <<: *atom-image
    entrypoint: ["bash", "/atom/src/plugins/arUnicaucaB5Plugin/tools/watch.sh"]
    volumes:
      - ./plugins/arUnicaucaB5Plugin:/atom/src/plugins/arUnicaucaB5Plugin
      # Derivado y reconstruible (webpack `clean: true`): NO es estado, NO va a backup.
      - theme_dist:/atom/src/dist

  # Runtime AtoM (PHP-FPM, escucha en 9000 solo dentro de la red Compose; lo consume `nginx`).
  #
  # Gate: depende de `bootstrap` con service_completed_successfully, así que `atom` solo puede arrancar
  # después de un bootstrap exitoso (BD DB_COMPATIBLE + instalación completa; sobre una BD FRESH la instala,
  # en cualquier otro estado hace STOP). El bootstrap es idempotente: una BD DB_COMPATIBLE + INSTALL_COMPLETE
  # nunca se reinstala.
  #
  # Entrypoint del proyecto sobre el upstream (regeneran la configuración runtime desde el entorno en cada arranque; el
  # settings.yml se deriva de defaults + entorno + secreto, nunca se persiste); el código de AtoM viene de la imagen, sin bind
  # del checkout. Solo uploads/ y downloads/ se persisten. El secreto CSRF se monta RO desde `atom_secrets`.
  #
  # Theme: el plugin del proyecto se monta RO, sobre el directorio del plugin (nunca /atom/src completo): los template
  # overrides que edites en el host se ven sin rebuild de imagen. Depende de `theme_build` (genera su
  # templates/_layout_start.php): no arranca con un theme sin compilar.
  # ATOM_DEVELOPMENT_MODE (upstream): opcache.validate_timestamps=On → los template overrides se ven sin reload de
  # FPM (hasta ~2 s, opcache.revalidate_freq por defecto); otros cambios PHP/config del plugin no tienen esa garantía.
  # También expone /qubit_dev.php. Solo en `atom`; no lo lleva el worker.
  # El puerto web sigue publicado solo en 127.0.0.1 (ver `nginx`). No altera NODE_ENV (el build sigue en production).
  atom:
    <<: *atom-image
    # Entrypoint del proyecto (aplica cultura/timezone/secreto y delega en el upstream); el CMD de la imagen se pierde al
    # redefinir el entrypoint, por eso `fpm` se declara aquí.
    entrypoint: ["bash", "/project/scripts/runtime-config.sh"]
    command: ["fpm"]
    environment:
      <<: [*atom-connection-env, *atom-runtime-env]
      ATOM_DEVELOPMENT_MODE: "true"
    volumes:
      - *atom-runtime-script
      - *atom-secrets-volume
      - ./plugins/arUnicaucaB5Plugin:/atom/src/plugins/arUnicaucaB5Plugin:ro
      # Estado autoritativo: objetos digitales (no reconstruibles).
      - uploads_data:/atom/src/uploads
      # Política conservadora: mezcla de reconstruible (informes, EAD/XML) y no reconstruible; se persiste.
      - downloads_data:/atom/src/downloads
    healthcheck:
      # Vivacidad de PHP-FPM: el socket de la pool acepta conexiones (sin ejecutar AtoM; la readiness HTTP es scripts/web-ready.sh).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      reconcile:
        condition: service_completed_successfully
      theme_build:
        condition: service_completed_successfully
      percona:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      memcached:
        condition: service_healthy
      gearmand:
        condition: service_healthy

  # Worker de jobs de AtoM (Gearman): `php symfony jobs:worker`. Mismo build/imagen que `atom`.
  #
  # Gate: igual que `atom`, depende de `bootstrap` con service_completed_successfully; nunca ejecuta
  # jobs:worker contra una BD sin instalar/incompatible. No duplica el probe ni el installation-check.
  #
  # `command: worker` es el atajo del entrypoint upstream (tras el del proyecto: regenera la configuración runtime desde el
  # entorno, espera 10 s y hace exec de `php symfony jobs:worker`). Persistencia: solo uploads/ y downloads/
  # (RW, mismos volúmenes que `atom`, porque los jobs de exportación/importación los escriben); el código
  # viene de la imagen. Sin puerto ni bind del checkout (salvo el plugin del theme, RO, y el script de health).
  atom_worker:
    <<: *atom-image
    command: ["worker"]
    # jobs:worker sale con error si pierde la BD (su ping SELECT 1 cada ~30 s); Gearmand, en cambio, se reconecta solo.
    # on-failure:5 (como upstream) recupera fallos TRANSITORIOS reintentando contra la MISMA BD (cada arranque espera
    # 10 s); agotado, queda unhealthy/exited. Un reinicio automático NO ejecuta el bootstrap ni sustituye su gate: ante
    # un restore/reemplazo/reset de la BD el worker debe recrearse con `up` (que vuelve a pasar por el bootstrap).
    restart: on-failure:5
    entrypoint: ["bash", "/project/scripts/runtime-config.sh"]
    environment:
      <<: [*atom-connection-env, *atom-runtime-env]
    volumes:
      - *atom-runtime-script
      - *atom-secrets-volume
      - uploads_data:/atom/src/uploads
      - downloads_data:/atom/src/downloads
      # Mismo plugin RO que `atom`: paridad del source de la aplicación (no significa que todo job lo requiera).
      - ./plugins/arUnicaucaB5Plugin:/atom/src/plugins/arUnicaucaB5Plugin:ro
      # Solo el script del healthcheck, RO.
      - ./scripts/worker-health.sh:/project/scripts/worker-health.sh:ro
    healthcheck:
      # Operativo = proceso jobs:worker + conexión suya registrada en Gearmand con funciones (ver el script).
      test: ["CMD", "bash", "/project/scripts/worker-health.sh"]
      interval: 10s
      timeout: 10s
      retries: 3
      # El entrypoint espera 10 s antes de lanzar jobs:worker.
      start_period: 30s
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      reconcile:
        condition: service_completed_successfully
      theme_build:
        condition: service_completed_successfully
      percona:
        condition: service_healthy
      gearmand:
        condition: service_healthy

  # Web DEV: Nginx (imagen propia mínima) delante de PHP-FPM. Único servicio con puerto publicado.
  #
  # Puerto: ATOM_WEB_PORT (default 8080) en 127.0.0.1. Readiness de aplicación: scripts/web-ready.sh.
  # nginx.conf se monta RO: tras editarlo, `docker compose restart nginx`.
  # Depende de `atom` healthy, que a su vez depende del bootstrap completado: sin cadena válida no arranca.
  # Los estáticos upstream (images/css/js y el dist de la imagen) van en la imagen, copiados de la imagen `atom`.
  # Sobre ellos, en DEV: `theme_dist` (RO) reemplaza /atom/src/dist con el build del theme (lo escribe solo
  # `theme_build`) y solo `images/` del plugin se monta RO como estático directo: NUNCA el plugin completo (no se
  # exponen scss/, webpack.entry.js, templates/ ni PHP). uploads/ y downloads/ se montan RO: Nginx solo lee
  # (estáticos y destino de X-Accel-Redirect); las escrituras siguen siendo exclusivas del runtime PHP.
  nginx:
    image: archivo-historico/nginx:2.10.2
    build:
      context: docker/nginx
      additional_contexts:
        # Compose construye antes `atom` y expone su imagen como contexto `atom`.
        atom: service:atom
    ports:
      # Loopback: acceso solo desde el host. El puerto es configurable.
      - "127.0.0.1:${ATOM_WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/atom/src/uploads:ro
      - downloads_data:/atom/src/downloads:ro
      - theme_dist:/atom/src/dist:ro
      - ./plugins/arUnicaucaB5Plugin/images:/atom/src/plugins/arUnicaucaB5Plugin/images:ro
    healthcheck:
      # Nginx sirve su capa estática (no ejecuta AtoM): la readiness de aplicación es scripts/web-ready.sh.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/robots.txt"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      atom:
        condition: service_healthy
      theme_build:
        condition: service_completed_successfully

volumes:
  percona_data:
  # Secreto CSRF local de DEV (lo escribe solo `dev_secrets`; el resto lo monta RO). ESTADO DE ENTORNO, no del proyecto: no va a Git ni a
  # la imagen. Sobrevive a stop/down/up; `down -v` (RESET DEV) lo elimina y el siguiente `up` genera uno nuevo. Ver docs/dev-runbook.md.
  atom_secrets:
  elasticsearch_data:
  # atom y atom_worker (RW); nginx (RO).
  uploads_data:
  downloads_data:
  # Bundles compilados del theme (Webpack). DERIVADO y RECONSTRUIBLE: no es estado ni entra en backup.
  # theme_build (RW) → nginx (RO). `atom` y `atom_worker` no lo montan.
  theme_dist:
